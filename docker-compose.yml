# The one compose file. Two ways to use it:
#   Everything in containers:  docker compose up --build
#   Host-dev (infra only):     docker compose up -d postgres redis
#
# Postgres is on 5433 (5432 is often taken). If your host already runs
# Ollama on 11434, set OLLAMA_HOST_PORT=11435 in .env.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: raphael_db
    environment:
      POSTGRES_USER: raphael
      POSTGRES_PASSWORD: raphael
      POSTGRES_DB: raphael
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raphael -d raphael"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: raphael_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports: ["${OLLAMA_HOST_PORT:-11434}:11434"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pull the tool-calling model into the ollama volume, then exit.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5:7b"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy

  user-svc:
    build: ./user-svc
    environment:
      DATABASE_URL: postgresql://raphael:raphael@postgres:5432/raphael
      CREDENTIAL_ENC_KEY: ${CREDENTIAL_ENC_KEY:?set CREDENTIAL_ENC_KEY in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # Google connectors (optional). :- not :? — inert when unset, like BRAVE_API_KEY.
      # user-svc does the token exchange, so it holds the secret; redirect_uri must
      # match gateway's on the exchange (Google requires it identical).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy

  conv-svc:
    build: ./conv-svc
    environment:
      DATABASE_URL: postgresql://raphael:raphael@postgres:5432/raphael
    depends_on:
      postgres:
        condition: service_healthy

  agent-svc:
    build: ./agent-svc
    environment:
      DATABASE_URL: postgresql://raphael:raphael@postgres:5432/raphael
      USER_SVC_URL: http://user-svc:8081
      CONV_SVC_URL: http://conv-svc:8082
      OLLAMA_BASE_URL: http://ollama:11434/v1
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # The knobs .env.example documents. Without these, compose silently ignores
      # them and only scripts/dev.sh's `set -a` ever delivers them.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
    depends_on:
      postgres:
        condition: service_healthy
      user-svc:
        condition: service_started
      conv-svc:
        condition: service_started

  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://raphael:raphael@postgres:5432/raphael
      REDIS_URL: redis://redis:6379/0
      USER_SVC_URL: http://user-svc:8081
      CONV_SVC_URL: http://conv-svc:8082
      AGENT_SVC_URL: http://agent-svc:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DEV_AUTH_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # The whatsapp-bridge (and any internal ingress) authenticates to the
      # gateway's /internal/* with this shared secret.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # Google connectors (optional). Gateway builds the consent URL and redirects
      # the browser back to WEB_ORIGIN; it forwards the code to user-svc for the
      # exchange, so it needs CLIENT_ID but not CLIENT_SECRET. :- keeps it inert.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
      user-svc:
        condition: service_started
      conv-svc:
        condition: service_started
      agent-svc:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on: [gateway]

  # Single-user WhatsApp edge. Behind a profile so a plain `docker compose up`
  # SKIPS it — the stack runs fine without WhatsApp. Enable with:
  #   docker compose --profile whatsapp up -d whatsapp-bridge
  # UNOFFICIAL library (Baileys) — can get the linked number banned. See
  # whatsapp-bridge/README.md before enabling.
  whatsapp-bridge:
    build: ./whatsapp-bridge
    profiles: ["whatsapp"]
    environment:
      GATEWAY_URL: http://gateway:8080
      CONV_SVC_URL: http://conv-svc:8082
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # Not :? — compose interpolates every service's env regardless of profile,
      # so a required-check here would break a plain `docker compose up`. If
      # unset the bridge itself logs "not configured" and exits 0 cleanly.
      WHATSAPP_OWNER_JID: ${WHATSAPP_OWNER_JID:-}
      WHATSAPP_OWNER_USER_ID: ${WHATSAPP_OWNER_USER_ID:-}
      WHATSAPP_MAX_CHARS: ${WHATSAPP_MAX_CHARS:-3500}
    volumes:
      - wa_auth:/data
    depends_on:
      gateway:
        condition: service_started
      conv-svc:
        condition: service_started

  # ---- central log aggregation (opt-in) -------------------------------------
  # Behind the `observability` profile, so a plain `docker compose up` is
  # unchanged. Start it with:
  #   docker compose --profile observability up -d
  # Grafana: http://localhost:3001  (admin / ${GRAFANA_PASSWORD:-raphael})
  # See ops/README.md.

  loki:
    image: grafana/loki:3.5.7
    container_name: raphael_loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports: ["3100:3100"]
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Alloy, not Promtail: Promtail is EOL. Tails the SAME ./logs/*.log files that
  # ./dev.sh writes (host processes, not containers), so no docker log driver
  # wiring is needed. Read-only mount — a shipper must never be able to write.
  alloy:
    image: grafana/alloy:v1.11.0
    container_name: raphael_alloy
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports: ["12345:12345"]   # Alloy's own UI/debug page
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/raphael:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.2
    container_name: raphael_grafana
    profiles: ["observability"]
    # 3001, not 3000: web owns 3000 on the host.
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-raphael}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
  wa_auth:
  loki_data:
  grafana_data:
  alloy_data:
