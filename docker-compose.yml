# The one compose file. Two ways to use it:
#   Everything in containers:  docker compose up --build
#   Host-dev (infra only):     docker compose up -d postgres redis
#
# Postgres is on 5433 (5432 is often taken). If your host already runs
# Ollama on 11434, set OLLAMA_HOST_PORT=11435 in .env.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: raphael_db
    environment:
      POSTGRES_USER: raphael
      POSTGRES_PASSWORD: raphael
      POSTGRES_DB: raphael
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raphael -d raphael"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: raphael_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports: ["${OLLAMA_HOST_PORT:-11434}:11434"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pull the tool-calling model into the ollama volume, then exit.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5:7b"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy

  user-svc:
    build: ./user-svc
    environment:
      DATABASE_URL: postgresql://raphael:raphael@postgres:5432/raphael
      CREDENTIAL_ENC_KEY: ${CREDENTIAL_ENC_KEY:?set CREDENTIAL_ENC_KEY in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy

  conv-svc:
    build: ./conv-svc
    environment:
      DATABASE_URL: postgresql://raphael:raphael@postgres:5432/raphael
    depends_on:
      postgres:
        condition: service_healthy

  agent-svc:
    build: ./agent-svc
    environment:
      DATABASE_URL: postgresql://raphael:raphael@postgres:5432/raphael
      USER_SVC_URL: http://user-svc:8081
      CONV_SVC_URL: http://conv-svc:8082
      OLLAMA_BASE_URL: http://ollama:11434/v1
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # The knobs .env.example documents. Without these, compose silently ignores
      # them and only scripts/dev.sh's `set -a` ever delivers them.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
    depends_on:
      postgres:
        condition: service_healthy
      user-svc:
        condition: service_started
      conv-svc:
        condition: service_started

  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://raphael:raphael@postgres:5432/raphael
      REDIS_URL: redis://redis:6379/0
      USER_SVC_URL: http://user-svc:8081
      CONV_SVC_URL: http://conv-svc:8082
      AGENT_SVC_URL: http://agent-svc:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DEV_AUTH_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
      user-svc:
        condition: service_started
      conv-svc:
        condition: service_started
      agent-svc:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on: [gateway]

volumes:
  pgdata:
  ollama:
