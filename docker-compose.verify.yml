# Verification override: run the five APP services as containers, but against
# the already-running HOST infra (raphael_db :5433, raphael_redis :6379, host
# Ollama :11434 with qwen2.5:7b already pulled). Avoids a 4.7GB in-container
# model pull and a second Postgres. Inter-service calls still use compose
# service names on the shared network; only infra is reached via the host.
#
#   docker compose -f docker-compose.full.yml -f docker-compose.verify.yml \
#     up -d --no-deps user-svc conv-svc agent-svc gateway web

services:
  user-svc:
    depends_on: []
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgresql://raphael:raphael@host.docker.internal:5433/raphael

  conv-svc:
    depends_on: []
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgresql://raphael:raphael@host.docker.internal:5433/raphael

  agent-svc:
    depends_on: []
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgresql://raphael:raphael@host.docker.internal:5433/raphael
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1

  gateway:
    depends_on: []
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DATABASE_URL: postgresql://raphael:raphael@host.docker.internal:5433/raphael
      REDIS_URL: redis://host.docker.internal:6379/0
